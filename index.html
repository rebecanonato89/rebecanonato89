    <script>
      (function () {
        try {
          var theme = localStorage.getItem('rn-theme');
          if (!theme) theme = 'dark';
          document.documentElement.setAttribute('data-theme', theme);

          if (localStorage.getItem('rn-contrast') === '1') {
            document.documentElement.setAttribute('data-contrast', 'high');
          }

          var step = parseInt(localStorage.getItem('rn-font-step') || '0', 10);
          if (!Number.isNaN(step) && step !== 0) {
            document.documentElement.style.fontSize = (100 + step * 10) + '%';
          }

          if (localStorage.getItem('rn-reduced-motion') === '1') {
            document.documentElement.classList.add('force-reduced-motion');
          }
        } catch (e) {
          /* localStorage indisponível — segue com os padrões */
        }
      })();
